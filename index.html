<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WFH Tracker">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<title>WFH Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#111827; --surface:#1f2937; --surface-hover:#374151;
    --text:#f3f4f6; --text-dim:#9ca3af; --text-muted:#6b7280;
    --office:#059669; --wfh:#6366f1; --off:#4b5563;
    --sel-bg:#1f2937; --sel-border:#374151;
    --today:#22d3ee; --accent:#22d3ee; --danger:#f87171; --success:#34d399;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;overscroll-behavior-y:contain}
  #ptr{position:fixed;top:-48px;left:50%;transform:translateX(-50%);width:36px;height:36px;background:var(--surface);border:1.5px solid var(--sel-border);border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:400;opacity:0;pointer-events:none;box-shadow:0 2px 12px rgba(0,0,0,.4);transition:border-color .15s}
  #ptr.ptr-ready{border-color:var(--accent)}
  .app{max-width:480px;margin:0 auto;padding:16px 12px 40px}

/* Header */
.header{position:relative;display:flex;align-items:center;justify-content:space-between;padding:8px 4px 20px}
.install-btn{position:absolute;top:8px;right:54px;background:none;border:1.5px solid #3b82f6;color:#3b82f6;width:34px;height:34px;border-radius:9px;cursor:pointer;display:none;align-items:center;justify-content:center;padding:0}
.install-btn:active{background:rgba(59,130,246,.15)}
.install-overlay{position:fixed;inset:0;z-index:299;cursor:pointer}
.install-tip{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#0c1a2e;border:1px solid #3b82f6;border-radius:14px;padding:14px 20px 14px;text-align:center;font-size:0.73rem;color:#93c5fd;max-width:272px;width:90%;z-index:300;box-shadow:0 8px 32px rgba(0,0,0,.7);animation:tipSlideUp .3s ease;pointer-events:none}
.install-tip b{color:#fff;display:block;margin-bottom:6px;font-size:0.8rem}
.month-title{font-family:'JetBrains Mono',monospace;font-size:1.2rem;font-weight:700;letter-spacing:-0.5px}
.nav-btn{background:var(--surface);border:1px solid var(--sel-border);color:var(--text);width:42px;height:42px;border-radius:10px;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.nav-btn:active{background:var(--surface-hover)}
.icon-btn{background:var(--surface);border:1px solid var(--sel-border);color:var(--text);width:34px;height:34px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:opacity .15s}
.icon-btn:active{background:var(--surface-hover)}
.icon-btn:disabled{opacity:0.3;cursor:default;pointer-events:none}

/* Legend */
.legend{display:flex;gap:6px;margin-bottom:14px;flex-wrap:nowrap;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none}
.legend::-webkit-scrollbar{display:none}
.legend-item{display:flex;align-items:center;gap:6px;font-size:0.72rem;color:var(--text-dim);background:var(--surface);padding:5px 10px;border-radius:8px;font-weight:500}
.legend-lock-btn{border:1px solid var(--sel-border);cursor:pointer;font-family:'DM Sans',sans-serif;transition:border-color .15s,color .15s}
.legend-lock-btn:active{border-color:#6366f1;color:#a5b4fc}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.tap-hint{text-align:center;font-size:0.7rem;color:var(--text-muted);margin-bottom:10px;font-style:italic}

/* Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:24px}
.day-hdr{text-align:center;font-size:0.68rem;font-weight:600;color:var(--text-muted);padding:2px 0 8px;text-transform:uppercase;letter-spacing:0.5px}
.day-hdr.wknd{color:#5eead4;opacity:.7}

.day-cell{aspect-ratio:1/1.1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border:2px solid transparent;transition:transform 0.1s;position:relative;min-height:50px;user-select:none;overflow:visible}
.day-cell:active{transform:scale(0.92)}
.day-num{font-family:'JetBrains Mono',monospace;font-size:0.92rem;font-weight:700;line-height:1}
.day-lbl{font-size:0.52rem;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;line-height:1;opacity:.9}

.day-cell.sel{background:var(--sel-bg);border-color:var(--sel-border)}
.day-cell.sel .day-lbl{color:var(--text-muted)}
.day-cell.office{background:var(--office)}
.day-cell.wfh{background:var(--wfh)}
.day-cell.off{background:var(--off)}
.day-cell.is-today{border-color:var(--today)!important;box-shadow:0 0 12px rgba(34,211,238,.3)}
.day-cell.faded{opacity:.3}
.day-cell.hol-dot::after{content:'';position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:#f59e0b}
.lock-ind{position:absolute;top:4px;left:4px;color:rgba(255,255,255,.55);line-height:1;pointer-events:none}
.day-cell.is-locked{outline:2px solid rgba(255,255,255,.25);outline-offset:-2px}
/* Lock prompt */
.lock-prompt{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--sel-border);border-radius:14px;padding:16px 20px;text-align:center;width:90%;max-width:280px;z-index:300;box-shadow:0 8px 32px rgba(0,0,0,.7);animation:tipSlideUp .25s ease;pointer-events:all}
.lock-prompt b{color:var(--text);display:block;margin-bottom:4px;font-size:0.85rem}
.lock-prompt p{font-size:0.72rem;color:var(--text-muted);margin-bottom:14px}
.lock-prompt-btns{display:flex;gap:8px}
.lock-cancel-btn{flex:1;background:none;border:1px solid var(--sel-border);color:var(--text-muted);padding:8px;border-radius:8px;cursor:pointer;font-size:0.75rem;font-family:'DM Sans',sans-serif}
.lock-do-btn{flex:1;border:none;color:#fff;padding:8px;border-radius:8px;cursor:pointer;font-size:0.75rem;font-weight:600;font-family:'DM Sans',sans-serif;background:#6366f1}
.lock-do-btn.unlock{background:var(--danger)}
.day-cell.hol-active{border-color:#f59e0b!important;box-shadow:0 0 10px rgba(245,158,11,.35)}

/* Holiday popup */
.hol-popup{position:absolute;bottom:calc(100% + 6px);background:#1c1917;border:1px solid #f59e0b;border-radius:8px;padding:6px 9px;white-space:nowrap;z-index:100;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.5);animation:popIn .15s ease}
.hol-popup.anc-left{left:0}
.hol-popup.anc-right{right:0}
.hol-popup.anc-mid{left:50%;transform:translateX(-50%)}
.hol-popup::after{content:'';position:absolute;top:100%;border:5px solid transparent;border-top-color:#f59e0b}
.hol-popup.anc-left::after{left:10px}
.hol-popup.anc-right::after{right:10px}
.hol-popup.anc-mid::after{left:50%;transform:translateX(-50%)}
.hol-name{font-size:0.68rem;font-weight:700;color:#fbbf24;line-height:1.3}
.hol-hint{font-size:0.58rem;color:#a78bfa;margin-top:2px}

/* Stats panel */
.panel{background:var(--surface);border-radius:16px;padding:20px;border:1px solid var(--sel-border)}

/* Action buttons row */
.action-row{display:flex;gap:8px;margin-bottom:8px}
.act-btn{flex:1;background:none;border:1px solid var(--sel-border);color:var(--text-muted);font-size:0.75rem;padding:8px 10px;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500}
.act-btn:active{background:rgba(248,113,113,.15);border-color:var(--danger);color:var(--danger)}
.act-btn.act-on{background:rgba(5,150,105,.25);border-color:var(--office);color:var(--office)}

/* Weekday buttons */
.weekday-row{display:flex;gap:6px;margin-bottom:16px}
.wd-btn{flex:1;background:none;border:1px solid var(--sel-border);color:var(--text-dim);font-size:0.72rem;padding:7px 4px;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;text-align:center;transition:background .15s,border-color .15s,color .15s}
.wd-btn:active{opacity:.7}
.wd-btn.wd-on{background:rgba(5,150,105,.25);border-color:var(--office);color:var(--office)}

/* Confirm row */
.confirm-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px}
.confirm-msg{font-size:0.78rem;color:var(--danger);font-weight:500}
.confirm-yes{background:var(--danger);border:none;color:#fff;font-size:0.75rem;padding:7px 16px;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600}
.confirm-no{background:none;border:1px solid var(--sel-border);color:var(--text-muted);font-size:0.75rem;padding:7px 16px;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500}

/* Rate bar */
.rate-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.rate-title{font-size:0.72rem;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);font-weight:600}
.target-row{display:flex;align-items:center;gap:6px}
.target-lbl{font-size:0.72rem;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.target-input{background:var(--bg);border:1px solid var(--sel-border);color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700;width:48px;padding:4px;border-radius:8px;text-align:center;outline:none}
.target-input:focus{border-color:var(--accent)}
.bar-wrap{background:var(--bg);border-radius:8px;height:34px;position:relative;overflow:hidden}
.bar{height:100%;border-radius:8px;transition:width .4s ease;display:flex;align-items:center;min-width:0}
.bar.met{background:linear-gradient(90deg,var(--office),#10b981)}
.bar.fail{background:linear-gradient(90deg,#dc2626,#f87171)}
.bar-txt{font-family:'JetBrains Mono',monospace;font-size:0.78rem;font-weight:700;color:#fff;white-space:nowrap;padding:0 8px}
.target-line{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:2}
.target-line-lbl{position:absolute;top:-18px;transform:translateX(-50%);font-size:0.6rem;color:var(--accent);font-family:'JetBrains Mono',monospace;font-weight:700;white-space:nowrap}
.rate-status{text-align:center;margin-top:10px;font-size:0.82rem;font-weight:600}
.rate-status.met{color:var(--success)}
.rate-status.fail{color:var(--danger)}

/* Stat rows */
.divider{border-top:1px solid rgba(255,255,255,.1);margin:16px 0}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0}
.stat-row+.stat-row{border-top:1px solid rgba(255,255,255,.05)}
.stat-lbl{display:flex;align-items:center;gap:8px;font-size:0.85rem;color:var(--text-dim);font-weight:500}
.stat-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.stat-val{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700}

@keyframes popIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes tipSlideUp{from{opacity:0;transform:translateX(-50%) translateY(24px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.panel{animation:fadeUp .3s ease}
</style>
</head>
<body>
<div id="ptr"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M13.5 8a5.5 5.5 0 11-1.1-3.3" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round"/><path d="M10.5 4.5l1.9.2.2-1.9" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div class="app" id="app"></div>
<script>
(function(){
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var DAY_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var STATES = ['sel','office','wfh','off'];
  var HOL_STATES = ['office','wfh','off'];
  var LABELS = {sel:'Select',office:'Office',wfh:'WFH',off:'Off'};

  var HOLIDAYS = {
    '2025-01-01':"New Year's Day",'2025-01-27':'Australia Day',
    '2025-04-18':'Good Friday','2025-04-19':'Easter Saturday',
    '2025-04-20':'Easter Sunday','2025-04-21':'Easter Monday',
    '2025-04-25':'Anzac Day','2025-06-09':"King's Birthday",
    '2025-08-04':'Bank Holiday','2025-10-06':'Labour Day','2025-12-25':'Christmas Day','2025-12-26':'Boxing Day',
    '2026-01-01':"New Year's Day",'2026-01-26':'Australia Day',
    '2026-04-03':'Good Friday','2026-04-04':'Easter Saturday',
    '2026-04-05':'Easter Sunday','2026-04-06':'Easter Monday',
    '2026-04-25':'Anzac Day','2026-04-27':'Anzac Day (Additional)',
    '2026-06-08':"King's Birthday",'2026-08-03':'Bank Holiday','2026-10-05':'Labour Day',
    '2026-12-25':'Christmas Day','2026-12-26':'Boxing Day','2026-12-28':'Boxing Day (Additional)',
    '2027-01-01':"New Year's Day",'2027-01-26':'Australia Day',
    '2027-03-26':'Good Friday','2027-03-27':'Easter Saturday',
    '2027-03-28':'Easter Sunday','2027-03-29':'Easter Monday',
    '2027-04-25':'Anzac Day','2027-04-26':'Anzac Day (Additional)',
    '2027-06-14':"King's Birthday",'2027-08-02':'Bank Holiday','2027-10-04':'Labour Day',
    '2027-12-25':'Christmas Day','2027-12-26':'Boxing Day',
    '2027-12-27':'Christmas Day (Additional)','2027-12-28':'Boxing Day (Additional)'
  };

  var today = new Date();
  var cy = today.getFullYear();
  var cm = today.getMonth();
  var data = {};
  var target = 50;
  var confirming = false;
  var popupKey = null;
  var deferredInstall = null;
  var installable = false;
  var showTip = false;
  var showLockTip = false;
  var locked = {};
  var lockPromptKey = null;
  var lpTimer = null;
  var didLongPress = false;

  var VALID_STATES={office:1,wfh:1,off:1};
  var DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
  var undoStack=[], redoStack=[];
  function pushUndo(){undoStack.push(JSON.stringify(data));if(undoStack.length>50)undoStack.shift();redoStack=[];}
  function undo(){if(!undoStack.length)return;redoStack.push(JSON.stringify(data));data=JSON.parse(undoStack.pop());save();render();}
  function redo(){if(!redoStack.length)return;undoStack.push(JSON.stringify(data));data=JSON.parse(redoStack.pop());save();render();}
  function load(){
    try{
      var r=localStorage.getItem('wfh_v2');
      if(r){
        var p=JSON.parse(r);
        // Validate target is an integer 0–100
        var t=parseInt(p.target,10);
        target=(isFinite(t)&&t>=0&&t<=100)?t:50;
        // Validate each key is a date string and each value is a known state
        var raw=p.data||{};
        for(var k in raw){
          if(DATE_RE.test(k)&&VALID_STATES[raw[k]]) data[k]=raw[k];
        }
        var rawL=p.locked||{};
        for(var k in rawL){
          if(DATE_RE.test(k)&&rawL[k]===true) locked[k]=true;
        }
      }
    }catch(e){}
  }
  function save(){
    try{localStorage.setItem('wfh_v2',JSON.stringify({data:data,target:target,locked:locked}));}catch(e){}
  }

  function dk(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d);}
  function pad(n){return n<10?'0'+n:String(n);}
  function daysIn(y,m){return new Date(y,m+1,0).getDate();}
  function startDow(y,m){var d=new Date(y,m,1).getDay();return d===0?6:d-1;}
  function isToday(y,m,d){return y===today.getFullYear()&&m===today.getMonth()&&d===today.getDate();}
  function isWknd(y,m,d){var w=new Date(y,m,d).getDay();return w===0||w===6;}
  function isHol(key){return HOLIDAYS.hasOwnProperty(key);}
  function colOf(y,m,d){var w=new Date(y,m,d).getDay();return w===0?6:w-1;}

  function getState(key,y,m,d){
    if(data.hasOwnProperty(key)) return data[key];
    if(isWknd(y,m,d)||isHol(key)) return 'off';
    return 'sel';
  }

  function cell(key,y,m,d,faded){
    var st=getState(key,y,m,d);
    var hol=isHol(key);
    var cls='day-cell '+st;
    if(faded) cls+=' faded';
    if(isToday(y,m,d)) cls+=' is-today';
    if(hol) cls+=' hol-dot';
    if(hol&&popupKey===key) cls+=' hol-active';
    if(!faded&&locked[key]) cls+=' is-locked';

    var lp=faded?'':' ontouchstart="W.lps(\''+key+'\')" ontouchend="W.lpe()" ontouchcancel="W.lpe()" ontouchmove="W.lpe()" onmousedown="W.lps(\''+key+'\')" onmouseup="W.lpe()" onmouseleave="W.lpe()"';
    var out='<div class="'+cls+'"'+lp+' onclick="W.tap(\''+key+'\','+y+','+m+','+d+')">';
    out+='<div class="day-num">'+d+'</div>';
    out+='<div class="day-lbl">'+LABELS[st]+'</div>';
    if(!faded&&locked[key]) out+='<div class="lock-ind"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="1.5" y="4.5" width="7" height="5" rx="1" fill="rgba(255,255,255,.6)"/><path d="M3 4.5V3a2 2 0 014 0v1.5" stroke="rgba(255,255,255,.6)" stroke-width="1.2" stroke-linecap="round"/></svg></div>';
    if(hol&&popupKey===key){
      var col=colOf(y,m,d);
      var anc=col<=1?'anc-left':col>=5?'anc-right':'anc-mid';
      out+='<div class="hol-popup '+anc+'">';
      out+='<div class="hol-name">'+HOLIDAYS[key]+'</div>';
      out+='<div class="hol-hint">Tap again to set status</div>';
      out+='</div>';
    }
    out+='</div>';
    return out;
  }

  function render(){
    var total=daysIn(cy,cm);
    var start=startDow(cy,cm);

    var wfhC=0,officeC=0,offC=0,unsetC=0;
    for(var d=1;d<=total;d++){
      var st=getState(dk(cy,cm,d),cy,cm,d);
      if(st==='wfh') wfhC++;
      else if(st==='office') officeC++;
      else if(st==='off') offC++;
      else unsetC++;
    }
    var working=officeC+wfhC+unsetC;
    var rate=working>0?(officeC/working)*100:0;
    var met=rate>=target;

    var h='';

    // Header
    h+='<div class="header">';
    h+='<button class="nav-btn" onclick="W.prev()">\u2039</button>';
    h+='<div class="month-title">'+MONTHS[cm]+' '+cy+'</div>';
    h+='<button class="nav-btn" onclick="W.next()">\u203A</button>';
    // Install button — absolutely positioned, no layout impact
    var ibStyle=installable?'display:flex':'display:none';
    h+='<button class="install-btn" onclick="W.install()" title="Add to Home Screen" style="'+ibStyle+'">';
    h+='<svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7.5 1v7.5M4.5 5.5l3 3 3-3M1.5 10.5v1.5a1 1 0 001 1h10a1 1 0 001-1v-1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    h+='</button>';
    h+='</div>';
    // iOS install tip
    if(showTip){
      h+='<div class="install-overlay" onclick="W.closeTip()"></div>';
      h+='<div class="install-tip">';
      h+='<b>Add to Home Screen</b>';
      h+='Tap the Share button \uD83D\uDCE4 below, tap <em>View More</em>, then <em>Add to Home Screen</em>';
      h+='</div>';
    }

    // Legend
    h+='<div class="legend">';
    h+='<div class="legend-item"><div class="legend-dot" style="background:var(--office)"></div>Office</div>';
    h+='<div class="legend-item"><div class="legend-dot" style="background:var(--wfh)"></div>WFH</div>';
    h+='<div class="legend-item"><div class="legend-dot" style="background:var(--off)"></div>Off</div>';
    h+='<div class="legend-item"><div class="legend-dot" style="background:#f59e0b;border-radius:50%"></div>Public Holiday</div>';
    h+='<button class="legend-item legend-lock-btn" onclick="W.toggleLockTip()"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" style="flex-shrink:0"><rect x="1.5" y="4.5" width="7" height="5" rx="1" fill="rgba(255,255,255,.65)"/><path d="M3 4.5V3a2 2 0 014 0v1.5" stroke="rgba(255,255,255,.65)" stroke-width="1.2" stroke-linecap="round"/></svg>Locked</button>';
    h+='</div>';
    h+='<div class="tap-hint">Tap a day to cycle: Select \u2192 Office \u2192 WFH \u2192 Off</div>';
    if(showLockTip){
      h+='<div class="install-overlay" onclick="W.toggleLockTip()"></div>';
      h+='<div class="install-tip" style="border-color:#6366f1">';
      h+='<b style="color:#a5b4fc">Locking Days</b>';
      h+='<span style="color:#c7d2fe">Long press any day to lock it. Locked days show a \uD83D\uDD12 icon and can\'t be changed by a normal tap. Long press again to unlock.</span>';
      h+='</div>';
    }

    // Calendar
    h+='<div class="cal-grid">';
    for(var i=0;i<7;i++) h+='<div class="day-hdr'+(i>=5?' wknd':'')+'">'+DAY_NAMES[i]+'</div>';

    var pm=cm===0?11:cm-1, py=cm===0?cy-1:cy;
    var pd=daysIn(py,pm);
    for(var i=0;i<start;i++){var dd=pd-start+1+i;h+=cell(dk(py,pm,dd),py,pm,dd,true);}
    for(var d=1;d<=total;d++){h+=cell(dk(cy,cm,d),cy,cm,d,false);}
    var rem=(start+total)%7===0?0:7-(start+total)%7;
    var nm=cm===11?0:cm+1, ny=cm===11?cy+1:cy;
    for(var i=1;i<=rem;i++){h+=cell(dk(ny,nm,i),ny,nm,i,true);}
    h+='</div>';

    // Panel
    h+='<div class="panel">';

    // Action buttons or confirm
    if(confirming){
      h+='<div class="confirm-row">';
      h+='<span class="confirm-msg">Reset this month?</span>';
      h+='<button class="confirm-yes" onclick="W.doReset()">Yes, Reset</button>';
      h+='<button class="confirm-no" onclick="W.cancelReset()">Cancel</button>';
      h+='</div>';
    } else {
      h+='<div class="action-row">';
      var allOfficeMth=true,hasWd=false;
      for(var d=1;d<=total;d++){if(!isWknd(cy,cm,d)&&!isHol(dk(cy,cm,d))){hasWd=true;if(getState(dk(cy,cm,d),cy,cm,d)!=='office'){allOfficeMth=false;}}}
      h+='<button class="act-btn'+(hasWd&&allOfficeMth?' act-on':'')+'" onclick="W.fillOffice()">\uD83C\uDFE2 All Office</button>';
      h+='<button class="act-btn" onclick="W.startReset()">Reset Month</button>';
      h+='<button class="icon-btn"'+(undoStack.length?'':' disabled')+' onclick="W.undo()" title="Undo"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M5 3.5L2.5 6l2.5 2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 6H9a3.5 3.5 0 0 1 0 7H6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>';
      h+='<button class="icon-btn"'+(redoStack.length?'':' disabled')+' onclick="W.redo()" title="Redo"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M10 3.5L12.5 6 10 8.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.5 6H6a3.5 3.5 0 0 0 0 7H9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>';
      h+='</div>';
      h+='<div class="weekday-row">';
      var wdNames=['Mon','Tue','Wed','Thu','Fri'];
      for(var wi=0;wi<5;wi++){
        var dow=wi+1;
        var allOn=true;
        var hasAny=false;
        for(var d=1;d<=total;d++){
          if(new Date(cy,cm,d).getDay()===dow&&!isHol(dk(cy,cm,d))){
            hasAny=true;
            if(getState(dk(cy,cm,d),cy,cm,d)!=='office'){allOn=false;}
          }
        }
        var cls='wd-btn'+(hasAny&&allOn?' wd-on':'');
        h+='<button class="'+cls+'" onclick="W.fillWeekday('+dow+')">'+wdNames[wi]+'</button>';
      }
      h+='</div>';
    }

    // Rate bar
    h+='<div class="rate-header">';
    h+='<div class="rate-title">Attendance Rate</div>';
    h+='<div class="target-row"><span class="target-lbl">Target</span>';
    h+='<input class="target-input" type="number" min="0" max="100" inputmode="numeric" value="'+target+'" onchange="W.setTarget(this.value)">';
    h+='<span class="target-lbl">%</span></div>';
    h+='</div>';
    h+='<div class="bar-wrap">';
    h+='<div class="target-line" style="left:'+target+'%"><div class="target-line-lbl">'+target+'%</div></div>';
    var bw=working>0?Math.max(Math.min(rate,100),5):0;
    h+='<div class="bar '+(met?'met':'fail')+'" style="width:'+bw+'%"><span class="bar-txt">'+rate.toFixed(1)+'%</span></div>';
    h+='</div>';
    if(working>0){
      h+='<div class="rate-status '+(met?'met':'fail')+'">';
      if(met){h+='\u2713 Target met! '+rate.toFixed(1)+'% in office';}
      else{var nd=Math.max(0,Math.ceil(target/100*working)-officeC);h+='\u2717 '+nd+' more office day'+(nd!==1?'s':'')+' to reach '+target+'%';}
      h+='</div>';
    }

    // Divider + stats
    h+='<div class="divider"></div>';
    h+='<div class="stat-row"><span class="stat-lbl"><span class="stat-dot" style="background:var(--office)"></span>In Office</span><span class="stat-val" style="color:var(--office)">'+officeC+'</span></div>';
    h+='<div class="stat-row"><span class="stat-lbl"><span class="stat-dot" style="background:var(--wfh)"></span>WFH</span><span class="stat-val" style="color:var(--wfh)">'+wfhC+'</span></div>';
    h+='<div class="stat-row"><span class="stat-lbl"><span class="stat-dot" style="background:var(--off)"></span>Non-Working</span><span class="stat-val" style="color:var(--text-muted)">'+offC+'</span></div>';
    if(unsetC>0) h+='<div class="stat-row"><span class="stat-lbl"><span class="stat-dot" style="background:var(--sel-border)"></span>Select</span><span class="stat-val" style="color:var(--text-muted)">'+unsetC+'</span></div>';
    h+='<div class="stat-row"><span class="stat-lbl"><span class="stat-dot" style="background:var(--accent)"></span>Working Days</span><span class="stat-val" style="color:var(--accent)">'+working+'</span></div>';
    h+='</div>';

    // Lock prompt overlay
    if(lockPromptKey){
      var lkey=lockPromptKey;
      var isLocked=!!locked[lkey];
      var lparts=lkey.split('-');
      var ly=parseInt(lparts[0],10),lm=parseInt(lparts[1],10)-1,ld=parseInt(lparts[2],10);
      var lday=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date(ly,lm,ld).getDay()];
      h+='<div class="install-overlay" onclick="W.lockCancel()"></div>';
      h+='<div class="lock-prompt">';
      h+='<b>'+lday+', '+ld+' '+MONTHS[lm]+'</b>';
      h+='<p>'+(isLocked?'Unlock this day?':'Lock this day to prevent accidental changes.')+'</p>';
      h+='<div class="lock-prompt-btns">';
      h+='<button class="lock-cancel-btn" onclick="W.lockCancel()">Cancel</button>';
      h+='<button class="lock-do-btn'+(isLocked?' unlock':'')+'" onclick="W.lockConfirm(\''+lkey+'\')">'+(isLocked?'Unlock Day':'Lock Day')+'</button>';
      h+='</div></div>';
    }

    document.getElementById('app').innerHTML=h;
  }

  function tap(key,y,m,d){
    if(didLongPress){didLongPress=false;return;}
    if(locked[key]) return;
    pushUndo();
    var hol=isHol(key);
    if(hol){
      if(!data.hasOwnProperty(key)&&popupKey!==key){
        popupKey=key; render(); return;
      }
      popupKey=null;
      var cur=getState(key,y,m,d);
      var idx=HOL_STATES.indexOf(cur);
      var nxt=HOL_STATES[(idx+1)%HOL_STATES.length];
      if(nxt==='off'){delete data[key];}else{data[key]=nxt;}
    } else {
      popupKey=null;
      var cur=getState(key,y,m,d);
      var idx=STATES.indexOf(cur);
      var nxt=STATES[(idx+1)%STATES.length];
      if(nxt==='sel'){delete data[key];}else{data[key]=nxt;}
    }
    save(); render();
  }

  function prev(){popupKey=null;if(cm===0){cm=11;cy--;}else cm--;render();}
  function next(){popupKey=null;if(cm===11){cm=0;cy++;}else cm++;render();}
  function setTarget(v){target=Math.max(0,Math.min(100,parseInt(v,10)||50));save();render();}
  function fillOffice(){
    pushUndo();
    var total=daysIn(cy,cm);
    var allOffice=true;
    for(var d=1;d<=total;d++){
      var key=dk(cy,cm,d);
      if(!isWknd(cy,cm,d)&&!isHol(key)){
        if(getState(key,cy,cm,d)!=='office'){allOffice=false;break;}
      }
    }
    for(var d=1;d<=total;d++){
      var key=dk(cy,cm,d);
      if(!isWknd(cy,cm,d)&&!isHol(key)){
        if(allOffice) delete data[key]; else data[key]='office';
      }
    }
    save();render();
  }
  function fillWeekday(dow){
    pushUndo();
    var total=daysIn(cy,cm);
    // check if all matching weekdays are already office
    var allOffice=true;
    for(var d=1;d<=total;d++){
      var key=dk(cy,cm,d);
      if(new Date(cy,cm,d).getDay()===dow&&!isHol(key)){
        if(getState(key,cy,cm,d)!=='office'){allOffice=false;break;}
      }
    }
    for(var d=1;d<=total;d++){
      var key=dk(cy,cm,d);
      if(new Date(cy,cm,d).getDay()===dow&&!isHol(key)){
        if(allOffice) delete data[key]; else data[key]='office';
      }
    }
    save();render();
  }
  function startReset(){confirming=true;render();}
  function doReset(){
    pushUndo();
    var total=daysIn(cy,cm);
    for(var d=1;d<=total;d++) delete data[dk(cy,cm,d)];
    confirming=false;save();render();
  }
  function cancelReset(){confirming=false;render();}

  function lps(key){
    didLongPress=false;
    clearTimeout(lpTimer);
    lpTimer=setTimeout(function(){
      didLongPress=true;
      lockPromptKey=key;
      render();
    },550);
  }
  function lpe(){
    clearTimeout(lpTimer);
    lpTimer=null;
  }
  function lockConfirm(key){
    if(locked[key]){delete locked[key];}else{locked[key]=true;}
    lockPromptKey=null;
    save();render();
  }
  function lockCancel(){
    lockPromptKey=null;
    render();
  }

  function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;}
  function install(){
    if(deferredInstall){
      deferredInstall.prompt();
      deferredInstall.userChoice.then(function(){deferredInstall=null;installable=false;render();});
    } else {
      showTip=!showTip; render();
    }
  }
  function closeTip(){showTip=false;render();}
  function toggleLockTip(){showLockTip=!showLockTip;render();}

  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault(); deferredInstall=e; installable=true; render();
  });
  window.addEventListener('appinstalled',function(){
    deferredInstall=null; installable=false; showTip=false; render();
  });

  window.W={tap:tap,prev:prev,next:next,setTarget:setTarget,fillOffice:fillOffice,fillWeekday:fillWeekday,startReset:startReset,doReset:doReset,cancelReset:cancelReset,install:install,closeTip:closeTip,toggleLockTip:toggleLockTip,undo:undo,redo:redo,lps:lps,lpe:lpe,lockConfirm:lockConfirm,lockCancel:lockCancel};
  load();
  // Show button on iOS Safari when not already installed
  if(isIOS()&&!navigator.standalone) installable=true;
  render();
})();
</script>
<script>
(function(){
  var ptr=document.getElementById('ptr');
  var startY=0,dist=0,pulling=false,THRESH=65,refreshing=false;
  document.addEventListener('touchstart',function(e){
    if(window.scrollY===0&&!refreshing){startY=e.touches[0].clientY;pulling=true;}
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!pulling) return;
    dist=Math.max(0,e.touches[0].clientY-startY);
    var p=Math.min(dist/THRESH,1);
    ptr.style.top=(dist*0.38-46)+'px';
    ptr.style.opacity=p;
    ptr.querySelector('svg').style.transform='rotate('+(p*270)+'deg)';
    if(dist>=THRESH) ptr.classList.add('ptr-ready'); else ptr.classList.remove('ptr-ready');
  },{passive:true});
  document.addEventListener('touchend',function(){
    if(!pulling) return;
    pulling=false;
    if(dist>=THRESH){
      refreshing=true;
      ptr.querySelector('svg').style.transition='transform .4s ease';
      ptr.querySelector('svg').style.transform='rotate(360deg)';
      setTimeout(function(){location.reload();},350);
    } else {
      ptr.style.transition='top .3s,opacity .3s';
      ptr.style.top='-48px';
      ptr.style.opacity='0';
      setTimeout(function(){ptr.style.transition='';},300);
    }
    dist=0;
  });
})();
</script>
</body>
